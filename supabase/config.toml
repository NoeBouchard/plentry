# Supabase project config. `project_id` is the local project name (any string);
# the remote project is linked via `supabase link --project-ref ucciqthwxnlkjalwlhvh`.
project_id = "plentry"

# ---- Edge Functions ----------------------------------------------------------
# `verify_jwt` is the PLATFORM-level JWT gate, checked before your handler runs.
#
#   auth: 'user'                       -> leave verify_jwt = true  (the default)
#   auth: 'publishable'|'secret'|'none' -> set  verify_jwt = false
#
# (the example `orders` function was removed 7 Jul 2026 — extra unvalidated
# write path; if it was ever deployed, run: supabase functions delete orders)

# The `ai` function uses auth: ['user', 'publishable'] (works logged in or out),
# so the platform JWT gate must be OFF — the SDK does the auth check instead.
[functions.ai]
verify_jwt = false

# `checkout` (Pepesto basket creation) also uses auth: ['user', 'publishable'];
# it answers {live:false} to logged-out callers so credits can't be burned anonymously.
[functions.checkout]
verify_jwt = false

# `notify-order` is called by the Database Webhook on orders INSERT (no user
# JWT); it gates on the x-webhook-secret header instead.
[functions.notify-order]
verify_jwt = false

# `pay` (Stripe checkout/capture) requires a signed-in user.
[functions.pay]
verify_jwt = true

# `newcoming` is called by pg_cron (no user JWT); gated by x-webhook-secret
# (same ORDER_WEBHOOK_SECRET as notify-order).
[functions.newcoming]
verify_jwt = false

# `stripe-webhook` is called by Stripe (no user JWT); gated by signature check.
[functions.stripe-webhook]
verify_jwt = false
