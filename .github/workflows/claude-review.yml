# Merge gate. Does not deploy. Fails unless Claude's structured verdict is APPROVE.
# The action skips this job's review when this file differs from the default branch
# (see doc/RUNBOOK.md, Claude review gate). That includes the PR that adds it.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    name: claude-review
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Review pull request
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out. Stay inside the allowed tools: Read, Grep, Glob, and Bash only for `gh pr comment`, `gh pr diff`, and `gh pr view`.

            Read these files first, in this order, before you review the diff:
            1. AGENTS.md
            2. doc/ARCHITECTURE.md
            3. doc/INVARIANTS.md
            4. doc/CURRENT-STATE.md
            5. doc/REQUIREMENTS.md

            Then read every file the diff touches. Where a changed function has callers that can change behaviour, read those callers too.

            Use `gh pr diff` and `gh pr view` for this PR.

            On this diff, check each of the following and say what you found:
            - Money paths. The card hold is the shop total times 1.05 times 1.30. The 5% fee stays in both index.html and supabase/functions/pay/index.ts. Capture adds that 5% on the server and stays within the hold.
            - The basket block between `/* portions:start */` and `/* portions:end */` (both markers included) is byte-identical in index.html and supabase/functions/_shared/portions.ts. If the diff touches either copy, compare the two blocks.
            - RLS and admin rules: who can read or write orders, meals, and admin actions, including the founder aal2 gate.
            - XSS: unescaped HTML or markdown from meals, orders, chat, or other user content.
            - Drift between the docs above and the tests. Report a contradiction this diff introduces, or a rule this diff changes in one of those docs without the matching test (or the reverse).

            Post exactly one pull-request comment with `gh pr comment` (a review comment, not a formal GitHub review approval).
            The comment must end with exactly one line, and that line must be either:
            VERDICT: APPROVE
            or
            VERDICT: CHANGES_REQUESTED

            Use VERDICT: APPROVE only when the diff has no bug, security issue, or AGENTS.md violation that should block merge.
            Otherwise use VERDICT: CHANGES_REQUESTED.

            Set structured output `verdict` to the same choice, without the `VERDICT:` prefix: APPROVE or CHANGES_REQUESTED.
          claude_args: |
            --model opus
            --fallback-model sonnet
            --max-turns 50
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["APPROVE","CHANGES_REQUESTED"]}},"required":["verdict"]}'

      - name: Fail unless verdict is APPROVE
        if: always()
        env:
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$STRUCTURED_OUTPUT" ]; then
            echo "claude-review: no structured_output. Verdict is not APPROVE."
            exit 1
          fi
          verdict="$(printf '%s' "$STRUCTURED_OUTPUT" | jq -er '.verdict')" || {
            echo "claude-review: structured_output has no verdict."
            exit 1
          }
          echo "claude-review verdict: $verdict"
          if [ "$verdict" != "APPROVE" ]; then
            echo "claude-review failed: expected APPROVE."
            exit 1
          fi
